[workspace]
members = [
    "crates/service-platform",
    "crates/service-runtime",
    "crates/fake-server",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/elvinyao/go-service-platform"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["json", "ws"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
hyper = { version = "1.10.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sysinfo = "0.33.1"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
